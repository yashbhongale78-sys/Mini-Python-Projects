<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}ServiceHub{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      :root {
        --brand: #1570ef;
        --ink: #1f2937;
        --muted: #6b7280;
        --line: #e5e7eb;
        --soft: #f8fafc;
      }

      body {
        color: var(--ink);
        background: #ffffff;
      }

      .navbar {
        box-shadow: 0 2px 14px rgba(15, 23, 42, 0.08);
      }

      .hero {
        background: linear-gradient(135deg, #f8fafc 0%, #eaf2ff 100%);
        border-bottom: 1px solid var(--line);
        padding: 56px 0 42px;
      }

      .hero h1 {
        font-size: clamp(2rem, 5vw, 3.5rem);
        font-weight: 700;
        letter-spacing: 0;
      }

      .section-title {
        font-weight: 600;
        margin-bottom: 24px;
      }

      .pricing-card {
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: 0 6px 18px rgba(15, 23, 42, 0.06);
        height: 100%;
        overflow: hidden;
      }

      .pricing-card.featured {
        border-color: var(--brand);
      }

      .plan-header {
        background: #f8fafc;
        border-bottom: 1px solid var(--line);
        font-weight: 600;
        padding: 14px;
        text-align: center;
      }

      .featured .plan-header {
        background: var(--brand);
        color: #ffffff;
      }

      .price {
        font-size: 2rem;
        font-weight: 700;
      }

      .price span {
        color: var(--muted);
        font-size: 1rem;
        font-weight: 400;
      }

      .table th,
      .table td {
        border-color: var(--line);
        padding: 12px 10px;
      }

      .footer {
        background: #111827;
        color: #d1d5db;
        padding: 24px 0;
      }

      .simple-card {
        background: var(--soft);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 24px;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-white sticky-top">
      <div class="container">
        <a class="navbar-brand fw-bold" href="/">ServiceHub</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="/about">About</a></li>
            <li class="nav-item"><a class="nav-link" href="/services">Services</a></li>
            <li class="nav-item"><a class="nav-link" href="/contact">Contact</a></li>
          </ul>
          <form class="d-flex" role="search">
            <input class="form-control form-control-sm" type="search" placeholder="Search" aria-label="Search">
          </form>
        </div>
      </div>
    </nav>

    {% block content %}{% endblock %}

    <footer class="footer mt-5">
      <div class="container d-flex flex-column flex-md-row justify-content-between gap-2">
        <span>ServiceHub</span>
        <span>Reliable services, simple plans, quick support.</span>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
